<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 360px;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 18px;
      box-sizing: border-box;
    }

    .scale-wrapper {
      transform: scale(1.18);
      transform-origin: top center;
      width: 980px;
    }

    .focus-card {
      width: 980px;
      min-height: 205px;
      background: #fffdf9;
      border: 1px solid #e8d9d0;
      border-radius: 16px;
      box-sizing: border-box;
      padding: 18px 30px 18px;
      color: #241d19;
      position: relative;
      overflow: visible;
    }

    .edit-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      border: 1px solid #dcc8be;
      background: #fffaf6;
      color: #7a5c51;
      border-radius: 999px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      z-index: 5;
    }

    .edit-btn:hover {
      background: #f5ebe6;
    }

    .top-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 10.5px;
      letter-spacing: 1.4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3a2c24;
    }

    .icon {
      color: #8d7166;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 2.1fr 1.25fr 1.45fr 1.05fr;
      min-height: 138px;
    }

    .section {
      padding: 0 30px;
      border-left: 1px solid #e1d2ca;
      box-sizing: border-box;
    }

    .section:first-child {
      border-left: none;
      padding-left: 0;
      padding-right: 36px;
    }

    .section-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 9.6px;
      letter-spacing: 1.3px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
      color: #4a382f;
      text-align: center;
    }

    .section:first-child .section-title {
      text-align: left;
      padding-left: 2px;
    }

    .priority {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      color: #3a2b23;
      white-space: nowrap;
    }

    .number {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #eddcd5;
      color: #6e564c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .theme {
      text-align: center;
      padding-top: 18px;
    }

    .theme-main {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 24px;
      line-height: 1.12;
      font-weight: 500;
      color: #33241d;
      min-height: 58px;
    }

    .theme-flourish {
      margin-top: 8px;
      font-size: 20px;
      color: #8d786c;
    }

    .energy {
      text-align: center;
      padding-top: 2px;
    }

    .energy-gauge {
      width: 100%;
      max-width: 230px;
      margin: 0 auto;
    }

    .energy svg {
      width: 172px;
      height: 82px;
      overflow: visible;
      display: block;
      margin: 0 auto;
    }

    .track {
      fill: none;
      stroke: #e4dfd9;
      stroke-width: 7;
      stroke-linecap: round;
    }

    .progress {
      fill: none;
      stroke: #7f8968;
      stroke-width: 7;
      stroke-linecap: round;
      transition: all 0.25s ease;
    }

    .energy-label {
      margin-top: -10px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      color: #31241d;
    }

    .heart {
      color: #bd7f86;
      font-size: 10px;
      margin-left: 3px;
      position: relative;
      top: -1px;
    }

    .controls {
      margin-top: 9px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid #d8c9c0;
      background: #fffaf6;
      cursor: pointer;
      padding: 0;
    }

    .dot.active {
      background: #7f8968;
      border-color: #7f8968;
    }

    .cycle {
      text-align: center;
      padding-top: 6px;
    }

    .cycle-circle {
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: #f3d9d5;
      color: #b8757d;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      transition: all 0.25s ease;
    }

    .cycle-circle svg {
      width: 22px;
      height: 22px;
      display: block;
      margin: 0;
    }

    .phase-dropdown-wrap {
      position: relative;
      display: inline-block;
      max-width: 120px;
    }

    .phase-select {
      border: none;
      background: transparent;
      color: #31241d;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 16px;
      font-weight: 500;
      text-align: center;
      text-align-last: center;
      cursor: pointer;
      outline: none;
      padding: 0 16px 0 0;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    .phase-caret {
      position: absolute;
      right: 0;
      top: 52%;
      transform: translateY(-50%);
      font-size: 11px;
      color: #9c7d72;
      pointer-events: none;
    }

    .edit-panel {
      display: none;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eadfd8;
      grid-template-columns: 1.3fr 1.3fr 1.3fr 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .edit-panel.open {
      display: grid;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #eadfd8;
      border-radius: 10px;
      background: #fffaf6;
      padding: 8px 10px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 14px;
      color: #2f2925;
      outline: none;
    }

    input:focus {
      border-color: #d7bfb5;
      background: #fffdf9;
    }

    .save-btn {
      border: 1px solid #d7bfb5;
      background: #efe2dc;
      color: #5d453d;
      border-radius: 999px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 9px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .save-btn:hover {
      background: #e8d7cf;
    }
  </style>
</head>

<body>
  <div class="scale-wrapper">
    <div class="focus-card">
      <button class="edit-btn" onclick="toggleEdit()">Edit</button>

      <div class="top-title">
        <span class="icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"></circle>
            <circle cx="12" cy="12" r="4.7" fill="none" stroke="currentColor" stroke-width="1.7"></circle>
            <circle cx="12" cy="12" r="1.6" fill="currentColor"></circle>
          </svg>
        </span>
        <span>TODAY’S FOCUS</span>
      </div>

      <div class="content-grid">
        <div class="section">
          <div class="section-title">Top 3 Priorities</div>

          <div class="priority">
            <span class="number">1</span>
            <span id="priority1">Job search & send applications</span>
          </div>

          <div class="priority">
            <span class="number">2</span>
            <span id="priority2">Gym session — lower body</span>
          </div>

          <div class="priority">
            <span class="number">3</span>
            <span id="priority3">Stream setup & dinner prep</span>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Today’s Theme</div>
          <div class="theme">
            <div id="theme" class="theme-main">Discipline<br>is Freedom</div>
            <div class="theme-flourish">⌁</div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Energy Level</div>
          <div class="energy">
            <div class="energy-gauge">
              <svg viewBox="0 0 140 80">
                <path d="M16 60 A54 54 0 0 1 124 60" class="track"/>
                <path id="progress" d="M16 60 A54 54 0 0 1 102 20" class="progress"/>
              </svg>

              <div class="energy-label">
                <span id="label">High</span><span class="heart">♡</span>
              </div>

              <div class="controls">
                <button class="dot" id="btn-low" onclick="setLevel('low')" title="Low"></button>
                <button class="dot" id="btn-medium" onclick="setLevel('medium')" title="Medium"></button>
                <button class="dot" id="btn-high" onclick="setLevel('high')" title="High"></button>
                <button class="dot" id="btn-veryhigh" onclick="setLevel('veryhigh')" title="Very High"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Cycle Phase</div>

          <div class="cycle">
            <div class="cycle-circle" id="cycleIconWrap">
              <span id="cycleIcon"></span>
            </div>

            <div class="phase-dropdown-wrap">
              <select id="phaseSelect" class="phase-select" onchange="setPhase(this.value)">
                <option value="menstrual">Menstrual</option>
                <option value="follicular">Follicular</option>
                <option value="ovulatory">Ovulatory</option>
                <option value="luteal">Luteal</option>
              </select>
              <span class="phase-caret">▾</span>
            </div>
          </div>
        </div>
      </div>

      <div id="editPanel" class="edit-panel">
        <input id="inputPriority1" placeholder="Priority 1">
        <input id="inputPriority2" placeholder="Priority 2">
        <input id="inputPriority3" placeholder="Priority 3">
        <input id="inputTheme" placeholder="Today's theme">
        <button class="save-btn" onclick="saveEdits()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const energyOptions = {
      low: {
        label: "Low",
        path: "M16 60 A54 54 0 0 1 52 18"
      },
      medium: {
        label: "Medium",
        path: "M16 60 A54 54 0 0 1 78 8"
      },
      high: {
        label: "High",
        path: "M16 60 A54 54 0 0 1 102 20"
      },
      veryhigh: {
        label: "Very High",
        path: "M16 60 A54 54 0 0 1 124 60"
      }
    };

    const phaseOptions = {
      menstrual: {
        label: "Menstrual",
        bg: "#f3d9d5",
        color: "#c2838a",
        icon: `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3C12 3 7.5 8.3 7.5 12.1A4.5 4.5 0 0 0 12 16.6A4.5 4.5 0 0 0 16.5 12.1C16.5 8.3 12 3 12 3Z"/>
          </svg>
        `
      },
      follicular: {
        label: "Follicular",
        bg: "#e7ecdc",
        color: "#7f8968",
        icon: `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 18V11"/>
            <path d="M12 11C12 8.5 14 7 16.3 7C16.1 9.7 14.7 11 12 11Z"/>
            <path d="M12 13C12 10.8 10.5 9.4 8.2 9.2C8.4 11.9 9.8 13 12 13Z"/>
          </svg>
        `
      },
      ovulatory: {
        label: "Ovulatory",
        bg: "#f7e2d8",
        color: "#ba7b82",
        icon: `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 7.2C10.7 5.9 8.5 5.9 7.2 7.2C5.9 8.5 5.9 10.7 7.2 12L12 16.8L16.8 12C18.1 10.7 18.1 8.5 16.8 7.2C15.5 5.9 13.3 5.9 12 7.2Z"/>
          </svg>
        `
      },
      luteal: {
        label: "Luteal",
        bg: "#ede4de",
        color: "#8d7468",
        icon: `
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M15.5 4.2C13 4.6 10.9 6.7 10.4 9.2C9.8 12.6 12.4 15.5 15.7 15.5C17 15.5 18.1 15.1 19 14.4C18 17.2 15.3 19.2 12.1 19.2C8 19.2 4.8 16 4.8 11.9C4.8 8.7 6.8 6 9.6 5C8.9 5.9 8.5 7 8.5 8.3C8.5 11.6 11.4 14.2 14.8 13.6C17.3 13.1 19.4 11 19.8 8.5C20.2 6.3 19.1 4.4 17.4 3.4C16.9 3.8 16.3 4 15.5 4.2Z"/>
          </svg>
        `
      }
    };

    function setLevel(level) {
      const selected = energyOptions[level] || energyOptions.high;

      document.getElementById("label").textContent = selected.label;
      document.getElementById("progress").setAttribute("d", selected.path);

      Object.keys(energyOptions).forEach(key => {
        document.getElementById("btn-" + key).classList.remove("active");
      });

      document.getElementById("btn-" + level).classList.add("active");

      localStorage.setItem("energyLevel", level);
    }

    function setPhase(phase) {
      const selected = phaseOptions[phase] || phaseOptions.menstrual;

      document.getElementById("cycleIconWrap").style.background = selected.bg;
      document.getElementById("cycleIconWrap").style.color = selected.color;
      document.getElementById("cycleIcon").innerHTML = selected.icon;
      document.getElementById("phaseSelect").value = phase;

      localStorage.setItem("cyclePhase", phase);
    }

    function setText(id, value) {
      document.getElementById(id).innerHTML = value;
      localStorage.setItem(id, value);
    }

    function loadText(id) {
      const saved = localStorage.getItem(id);
      if (saved) {
        document.getElementById(id).innerHTML = saved;
      }
    }

    function toggleEdit() {
      const panel = document.getElementById("editPanel");
      panel.classList.toggle("open");

      document.getElementById("inputPriority1").value = document.getElementById("priority1").innerText;
      document.getElementById("inputPriority2").value = document.getElementById("priority2").innerText;
      document.getElementById("inputPriority3").value = document.getElementById("priority3").innerText;
      document.getElementById("inputTheme").value = document.getElementById("theme").innerText;
    }

    function saveEdits() {
      setText("priority1", document.getElementById("inputPriority1").value);
      setText("priority2", document.getElementById("inputPriority2").value);
      setText("priority3", document.getElementById("inputPriority3").value);

      const themeText = document.getElementById("inputTheme").value;
      setText("theme", themeText.replace(/\n/g, "<br>"));

      document.getElementById("editPanel").classList.remove("open");
    }

    ["priority1", "priority2", "priority3", "theme"].forEach(loadText);

    const savedLevel = localStorage.getItem("energyLevel") || "high";
    setLevel(savedLevel);

    const savedPhase = localStorage.getItem("cyclePhase") || "menstrual";
    setPhase(savedPhase);
  </script>
</body>
</html>
