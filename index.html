<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 270px;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 10px;
      box-sizing: border-box;
    }

    .focus-card {
      width: 980px;
      min-height: 178px;
      background: #fffdf9;
      border: 1px solid #e8d9d0;
      border-radius: 16px;
      box-sizing: border-box;
      padding: 18px 28px 16px;
      color: #241d19;
      position: relative;
      overflow: visible;
    }

    .edit-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      border: 1px solid #dcc8be;
      background: #fffaf6;
      color: #7a5c51;
      border-radius: 999px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      z-index: 5;
    }

    .edit-btn:hover {
      background: #f5ebe6;
    }

    .top-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 10.5px;
      letter-spacing: 1.4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3a2c24;
    }

    .icon {
      font-size: 13px;
      color: #8d7166;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.7fr 1.1fr 1fr 1.1fr;
      height: 124px;
    }

    .section {
      padding: 0 24px;
      border-left: 1px solid #e1d2ca;
      box-sizing: border-box;
    }

    .section:first-child {
      border-left: none;
      padding-left: 0;
      padding-right: 30px;
    }

    .section-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8.8px;
      letter-spacing: 1.3px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 13px;
      color: #4a382f;
      text-align: center;
    }

    .section:first-child .section-title {
      text-align: left;
      padding-left: 2px;
    }

    .priority {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 15.5px;
      font-weight: 500;
      color: #3a2b23;
      white-space: nowrap;
    }

    .number {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #eddcd5;
      color: #6e564c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 9.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .theme {
      text-align: center;
      padding-top: 12px;
    }

    .theme-main {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 24px;
      line-height: 1.08;
      font-weight: 500;
      color: #33241d;
      min-height: 54px;
    }

    .theme-flourish {
      margin-top: 5px;
      font-size: 17px;
      color: #8d786c;
    }

    .energy {
      text-align: center;
      padding-top: 0;
    }

    svg {
      width: 120px;
      height: 61px;
      overflow: visible;
      display: block;
      margin: 0 auto;
    }

    .track {
      fill: none;
      stroke: #e4dfd9;
      stroke-width: 7;
      stroke-linecap: round;
    }

    .progress {
      fill: none;
      stroke: #7f8968;
      stroke-width: 7;
      stroke-linecap: round;
      transition: all 0.25s ease;
    }

    .energy-label {
      margin-top: -8px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 16px;
      font-weight: 500;
      color: #31241d;
    }

    .heart {
      color: #bd7f86;
      font-size: 10px;
      margin-left: 3px;
      position: relative;
      top: -1px;
    }

    .controls {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid #d8c9c0;
      background: #fffaf6;
      cursor: pointer;
      padding: 0;
    }

    .dot.active {
      background: #7f8968;
      border-color: #7f8968;
    }

    .cycle {
      text-align: center;
      padding-top: 0;
      position: relative;
    }

    .phase-wheel {
      width: 76px;
      height: 76px;
      border-radius: 999px;
      background: #f7eee9;
      border: 1px solid #ead7d2;
      margin: 0 auto 5px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phase-centre {
      width: 43px;
      height: 43px;
      border-radius: 999px;
      background: #f3d9d5;
      color: #b8757d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      transition: all 0.25s ease;
    }

    .phase-btn {
      position: absolute;
      width: 21px;
      height: 21px;
      border-radius: 999px;
      border: 1px solid #e3c9c4;
      background: #fffdf9;
      color: #a27b74;
      cursor: pointer;
      padding: 0;
      font-size: 10px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Playfair Display", Georgia, serif;
      transition: all 0.2s ease;
    }

    .phase-btn:hover {
      background: #f6e7e3;
    }

    .phase-btn.active {
      background: #dca6a3;
      border-color: #dca6a3;
      color: #fffdf9;
      transform: scale(1.05);
    }

    .phase-btn.top {
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .phase-btn.right {
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
    }

    .phase-btn.bottom {
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
    }

    .phase-btn.left {
      left: -7px;
      top: 50%;
      transform: translateY(-50%);
    }

    .phase-btn.active.top {
      transform: translateX(-50%) scale(1.05);
    }

    .phase-btn.active.right {
      transform: translateY(-50%) scale(1.05);
    }

    .phase-btn.active.bottom {
      transform: translateX(-50%) scale(1.05);
    }

    .phase-btn.active.left {
      transform: translateY(-50%) scale(1.05);
    }

    .cycle-label {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 15.5px;
      font-weight: 500;
      color: #31241d;
      line-height: 1.1;
      margin-top: 6px;
    }

    .edit-panel {
      display: none;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #eadfd8;
      grid-template-columns: 1.3fr 1.3fr 1.3fr 1fr auto;
      gap: 9px;
      align-items: center;
    }

    .edit-panel.open {
      display: grid;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #eadfd8;
      border-radius: 10px;
      background: #fffaf6;
      padding: 7px 9px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 13.5px;
      color: #2f2925;
      outline: none;
    }

    input:focus {
      border-color: #d7bfb5;
      background: #fffdf9;
    }

    .save-btn {
      border: 1px solid #d7bfb5;
      background: #efe2dc;
      color: #5d453d;
      border-radius: 999px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 8px 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .save-btn:hover {
      background: #e8d7cf;
    }
  </style>
</head>

<body>
  <div class="focus-card">
    <button class="edit-btn" onclick="toggleEdit()">Edit</button>

    <div class="top-title">
      <span class="icon">◎</span>
      <span>TODAY’S FOCUS</span>
    </div>

    <div class="content-grid">
      <div class="section">
        <div class="section-title">Top 3 Priorities</div>

        <div class="priority">
          <span class="number">1</span>
          <span id="priority1">Job search & send applications</span>
        </div>

        <div class="priority">
          <span class="number">2</span>
          <span id="priority2">Gym session — lower body</span>
        </div>

        <div class="priority">
          <span class="number">3</span>
          <span id="priority3">Stream setup & dinner prep</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Today’s Theme</div>
        <div class="theme">
          <div id="theme" class="theme-main">Discipline<br>is Freedom</div>
          <div class="theme-flourish">⌁</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Energy Level</div>
        <div class="energy">
          <svg viewBox="0 0 120 70">
            <path d="M22 60 A38 38 0 0 1 98 60" class="track"/>
            <path id="progress" d="M22 60 A38 38 0 0 1 84 34" class="progress"/>
          </svg>

          <div class="energy-label">
            <span id="label">High</span><span class="heart">♡</span>
          </div>

          <div class="controls">
            <button class="dot" id="btn-low" onclick="setLevel('low')" title="Low"></button>
            <button class="dot" id="btn-medium" onclick="setLevel('medium')" title="Medium"></button>
            <button class="dot" id="btn-high" onclick="setLevel('high')" title="High"></button>
            <button class="dot" id="btn-veryhigh" onclick="setLevel('veryhigh')" title="Very High"></button>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Cycle Phase</div>

        <div class="cycle">
          <div class="phase-wheel">
            <button class="phase-btn top" id="phase-menstrual" onclick="setPhase('menstrual')" title="Menstrual">☾</button>
            <button class="phase-btn right" id="phase-follicular" onclick="setPhase('follicular')" title="Follicular">✿</button>
            <button class="phase-btn bottom" id="phase-ovulatory" onclick="setPhase('ovulatory')" title="Ovulatory">♡</button>
            <button class="phase-btn left" id="phase-luteal" onclick="setPhase('luteal')" title="Luteal">◐</button>

            <div class="phase-centre" id="phaseIcon">☾</div>
          </div>

          <div id="cyclePhase" class="cycle-label">Menstrual</div>
        </div>
      </div>
    </div>

    <div id="editPanel" class="edit-panel">
      <input id="inputPriority1" placeholder="Priority 1">
      <input id="inputPriority2" placeholder="Priority 2">
      <input id="inputPriority3" placeholder="Priority 3">
      <input id="inputTheme" placeholder="Today's theme">
      <button class="save-btn" onclick="saveEdits()">Save</button>
    </div>
  </div>

  <script>
    const energyOptions = {
      low: {
        label: "Low",
        path: "M22 60 A38 38 0 0 1 48 26"
      },
      medium: {
        label: "Medium",
        path: "M22 60 A38 38 0 0 1 68 22"
      },
      high: {
        label: "High",
        path: "M22 60 A38 38 0 0 1 84 34"
      },
      veryhigh: {
        label: "Very High",
        path: "M22 60 A38 38 0 0 1 98 60"
      }
    };

    const phaseOptions = {
      menstrual: {
        label: "Menstrual",
        icon: "☾",
        colour: "#f3d9d5",
        text: "#b8757d"
      },
      follicular: {
        label: "Follicular",
        icon: "✿",
        colour: "#e6ead8",
        text: "#7f8968"
      },
      ovulatory: {
        label: "Ovulatory",
        icon: "♡",
        colour: "#f6ded2",
        text: "#b8757d"
      },
      luteal: {
        label: "Luteal",
        icon: "◐",
        colour: "#eadfd8",
        text: "#8b6f64"
      }
    };

    function setLevel(level) {
      const selected = energyOptions[level] || energyOptions.high;

      document.getElementById("label").textContent = selected.label;
      document.getElementById("progress").setAttribute("d", selected.path);

      Object.keys(energyOptions).forEach(key => {
        document.getElementById("btn-" + key).classList.remove("active");
      });

      document.getElementById("btn-" + level).classList.add("active");

      localStorage.setItem("energyLevel", level);
    }

    function setPhase(phase) {
      const selected = phaseOptions[phase] || phaseOptions.menstrual;

      document.getElementById("cyclePhase").textContent = selected.label;
      document.getElementById("phaseIcon").textContent = selected.icon;
      document.getElementById("phaseIcon").style.background = selected.colour;
      document.getElementById("phaseIcon").style.color = selected.text;

      Object.keys(phaseOptions).forEach(key => {
        document.getElementById("phase-" + key).classList.remove("active");
      });

      document.getElementById("phase-" + phase).classList.add("active");

      localStorage.setItem("cyclePhase", phase);
    }

    function setText(id, value) {
      document.getElementById(id).innerHTML = value;
      localStorage.setItem(id, value);
    }

    function loadText(id) {
      const saved = localStorage.getItem(id);
      if (saved) {
        document.getElementById(id).innerHTML = saved;
      }
    }

    function toggleEdit() {
      const panel = document.getElementById("editPanel");
      panel.classList.toggle("open");

      document.getElementById("inputPriority1").value = document.getElementById("priority1").innerText;
      document.getElementById("inputPriority2").value = document.getElementById("priority2").innerText;
      document.getElementById("inputPriority3").value = document.getElementById("priority3").innerText;
      document.getElementById("inputTheme").value = document.getElementById("theme").innerText;
    }

    function saveEdits() {
      setText("priority1", document.getElementById("inputPriority1").value);
      setText("priority2", document.getElementById("inputPriority2").value);
      setText("priority3", document.getElementById("inputPriority3").value);

      const themeText = document.getElementById("inputTheme").value;
      setText("theme", themeText.replace(/\n/g, "<br>"));

      document.getElementById("editPanel").classList.remove("open");
    }

    ["priority1", "priority2", "priority3", "theme"].forEach(loadText);

    const savedLevel = localStorage.getItem("energyLevel") || "medium";
    setLevel(savedLevel);

    const savedPhase = localStorage.getItem("cyclePhase") || "menstrual";
    setPhase(savedPhase);
  </script>
</body>
</html>
