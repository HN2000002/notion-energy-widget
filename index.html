<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 360px;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 18px;
      box-sizing: border-box;
    }

    .scale-wrapper {
      transform: scale(1.18);
      transform-origin: top center;
      width: 980px;
    }

    .focus-card {
      width: 980px;
      min-height: 205px;
      background: #fffdf9;
      border: 1px solid #e8d9d0;
      border-radius: 16px;
      box-sizing: border-box;
      padding: 18px 30px 18px;
      color: #241d19;
      position: relative;
      overflow: visible;
    }

    .edit-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      border: 1px solid #dcc8be;
      background: #fffaf6;
      color: #7a5c51;
      border-radius: 999px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      z-index: 5;
    }

    .edit-btn:hover {
      background: #f5ebe6;
    }

    .top-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 10.5px;
      letter-spacing: 1.4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3a2c24;
    }

    .icon {
      font-size: 13px;
      color: #8d7166;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 2.1fr 1.3fr 1.2fr 1.2fr;
      min-height: 138px;
    }

    .section {
      padding: 0 30px;
      border-left: 1px solid #e1d2ca;
      box-sizing: border-box;
    }

    .section:first-child {
      border-left: none;
      padding-left: 0;
      padding-right: 36px;
    }

    .section-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 9.6px;
      letter-spacing: 1.3px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
      color: #4a382f;
      text-align: center;
    }

    .section:first-child .section-title {
      text-align: left;
      padding-left: 2px;
    }

    .priority {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 18px;
      font-weight: 500;
      color: #3a2b23;
      white-space: nowrap;
    }

    .number {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #eddcd5;
      color: #6e564c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .theme {
      text-align: center;
      padding-top: 18px;
    }

    .theme-main {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 24px;
      line-height: 1.12;
      font-weight: 500;
      color: #33241d;
      min-height: 58px;
    }

    .theme-flourish {
      margin-top: 8px;
      font-size: 20px;
      color: #8d786c;
    }

    .energy {
      text-align: center;
      padding-top: 10px;
    }

    svg {
      width: 126px;
      height: 66px;
      overflow: visible;
      display: block;
      margin: 0 auto;
    }

    .track {
      fill: none;
      stroke: #e4dfd9;
      stroke-width: 7;
      stroke-linecap: round;
    }

    .progress {
      fill: none;
      stroke: #7f8968;
      stroke-width: 7;
      stroke-linecap: round;
      transition: all 0.25s ease;
    }

    .energy-label {
      margin-top: -6px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 17px;
      font-weight: 500;
      color: #31241d;
    }

    .heart {
      color: #bd7f86;
      font-size: 10px;
      margin-left: 3px;
      position: relative;
      top: -1px;
    }

    .controls {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 7px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid #d8c9c0;
      background: #fffaf6;
      cursor: pointer;
      padding: 0;
    }

    .dot.active {
      background: #7f8968;
      border-color: #7f8968;
    }

    .cycle {
      text-align: center;
      padding-top: 8px;
    }

    .cycle-circle {
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: #f3d9d5;
      color: #b8757d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      margin: 0 auto 10px;
      transition: all 0.25s ease;
    }

    .cycle-label {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 16px;
      font-weight: 500;
      color: #31241d;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .phase-select {
      width: 118px;
      border: 1px solid #ead7d2;
      border-radius: 999px;
      background: #fffaf6;
      color: #6f564c;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 13px;
      padding: 6px 12px;
      outline: none;
      cursor: pointer;
      text-align: center;
      text-align-last: center;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    .phase-select:focus {
      border-color: #d9beb5;
      background: #fffdf9;
    }

    .select-wrap {
      position: relative;
      display: inline-block;
    }

    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      color: #9c7d72;
      pointer-events: none;
    }

    .edit-panel {
      display: none;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #eadfd8;
      grid-template-columns: 1.3fr 1.3fr 1.3fr 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .edit-panel.open {
      display: grid;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #eadfd8;
      border-radius: 10px;
      background: #fffaf6;
      padding: 8px 10px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 14px;
      color: #2f2925;
      outline: none;
    }

    input:focus {
      border-color: #d7bfb5;
      background: #fffdf9;
    }

    .save-btn {
      border: 1px solid #d7bfb5;
      background: #efe2dc;
      color: #5d453d;
      border-radius: 999px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 9px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .save-btn:hover {
      background: #e8d7cf;
    }
  </style>
</head>

<body>
  <div class="scale-wrapper">
    <div class="focus-card">
      <button class="edit-btn" onclick="toggleEdit()">Edit</button>

      <div class="top-title">
        <span class="icon">◎</span>
        <span>TODAY’S FOCUS</span>
      </div>

      <div class="content-grid">
        <div class="section">
          <div class="section-title">Top 3 Priorities</div>

          <div class="priority">
            <span class="number">1</span>
            <span id="priority1">Job search & send applications</span>
          </div>

          <div class="priority">
            <span class="number">2</span>
            <span id="priority2">Gym session — lower body</span>
          </div>

          <div class="priority">
            <span class="number">3</span>
            <span id="priority3">Stream setup & dinner prep</span>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Today’s Theme</div>
          <div class="theme">
            <div id="theme" class="theme-main">Discipline<br>is Freedom</div>
            <div class="theme-flourish">⌁</div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Energy Level</div>
          <div class="energy">
            <svg viewBox="0 0 120 70">
              <path d="M22 60 A38 38 0 0 1 98 60" class="track"/>
              <path id="progress" d="M22 60 A38 38 0 0 1 84 34" class="progress"/>
            </svg>

            <div class="energy-label">
              <span id="label">High</span><span class="heart">♡</span>
            </div>

            <div class="controls">
              <button class="dot" id="btn-low" onclick="setLevel('low')" title="Low"></button>
              <button class="dot" id="btn-medium" onclick="setLevel('medium')" title="Medium"></button>
              <button class="dot" id="btn-high" onclick="setLevel('high')" title="High"></button>
              <button class="dot" id="btn-veryhigh" onclick="setLevel('veryhigh')" title="Very High"></button>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Cycle Phase</div>

          <div class="cycle">
            <div class="cycle-circle" id="cycleIcon">🩸</div>
            <div id="cyclePhase" class="cycle-label">Menstrual</div>

            <div class="select-wrap">
              <select id="phaseSelect" class="phase-select" onchange="setPhase(this.value)">
                <option value="menstrual">Menstrual</option>
                <option value="follicular">Follicular</option>
                <option value="ovulatory">Ovulatory</option>
                <option value="luteal">Luteal</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div id="editPanel" class="edit-panel">
        <input id="inputPriority1" placeholder="Priority 1">
        <input id="inputPriority2" placeholder="Priority 2">
        <input id="inputPriority3" placeholder="Priority 3">
        <input id="inputTheme" placeholder="Today's theme">
        <button class="save-btn" onclick="saveEdits()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const energyOptions = {
      low: {
        label: "Low",
        path: "M22 60 A38 38 0 0 1 48 26"
      },
      medium: {
        label: "Medium",
        path: "M22 60 A38 38 0 0 1 68 22"
      },
      high: {
        label: "High",
        path: "M22 60 A38 38 0 0 1 84 34"
      },
      veryhigh: {
        label: "Very High",
        path: "M22 60 A38 38 0 0 1 98 60"
      }
    };

    const phaseOptions = {
      menstrual: {
        label: "Menstrual",
        icon: "🩸",
        bg: "#f3d9d5",
        color: "#b8757d"
      },
      follicular: {
        label: "Follicular",
        icon: "✿",
        bg: "#e6ead8",
        color: "#7f8968"
      },
      ovulatory: {
        label: "Ovulatory",
        icon: "♡",
        bg: "#f6ded2",
        color: "#b8757d"
      },
      luteal: {
        label: "Luteal",
        icon: "☾",
        bg: "#eadfd8",
        color: "#8b6f64"
      }
    };

    function setLevel(level) {
      const selected = energyOptions[level] || energyOptions.high;

      document.getElementById("label").textContent = selected.label;
      document.getElementById("progress").setAttribute("d", selected.path);

      Object.keys(energyOptions).forEach(key => {
        document.getElementById("btn-" + key).classList.remove("active");
      });

      document.getElementById("btn-" + level).classList.add("active");

      localStorage.setItem("energyLevel", level);
    }

    function setPhase(phase) {
      const selected = phaseOptions[phase] || phaseOptions.menstrual;

      document.getElementById("cyclePhase").textContent = selected.label;
      document.getElementById("cycleIcon").textContent = selected.icon;
      document.getElementById("cycleIcon").style.background = selected.bg;
      document.getElementById("cycleIcon").style.color = selected.color;
      document.getElementById("phaseSelect").value = phase;

      localStorage.setItem("cyclePhase", phase);
    }

    function setText(id, value) {
      document.getElementById(id).innerHTML = value;
      localStorage.setItem(id, value);
    }

    function loadText(id) {
      const saved = localStorage.getItem(id);
      if (saved) {
        document.getElementById(id).innerHTML = saved;
      }
    }

    function toggleEdit() {
      const panel = document.getElementById("editPanel");
      panel.classList.toggle("open");

      document.getElementById("inputPriority1").value = document.getElementById("priority1").innerText;
      document.getElementById("inputPriority2").value = document.getElementById("priority2").innerText;
      document.getElementById("inputPriority3").value = document.getElementById("priority3").innerText;
      document.getElementById("inputTheme").value = document.getElementById("theme").innerText;
    }

    function saveEdits() {
      setText("priority1", document.getElementById("inputPriority1").value);
      setText("priority2", document.getElementById("inputPriority2").value);
      setText("priority3", document.getElementById("inputPriority3").value);

      const themeText = document.getElementById("inputTheme").value;
      setText("theme", themeText.replace(/\n/g, "<br>"));

      document.getElementById("editPanel").classList.remove("open");
    }

    ["priority1", "priority2", "priority3", "theme"].forEach(loadText);

    const savedLevel = localStorage.getItem("energyLevel") || "high";
    setLevel(savedLevel);

    const savedPhase = localStorage.getItem("cyclePhase") || "menstrual";
    setPhase(savedPhase);
  </script>
</body>
</html>
