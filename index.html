<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 152px;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 188px;
      height: 142px;
      background: #fffdf9;
      border: 1px solid #e8d9d0;
      border-radius: 15px;
      text-align: center;
      box-sizing: border-box;
      padding-top: 12px;
      box-shadow: 0 0 0 0.5px rgba(120, 90, 75, 0.04);
    }

    .title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 7.6px;
      letter-spacing: 1.9px;
      font-weight: 700;
      color: #2f2925;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    svg {
      width: 96px;
      height: 50px;
      overflow: visible;
      display: block;
      margin: 0 auto;
    }

    .track {
      fill: none;
      stroke: #e4dfd9;
      stroke-width: 6;
      stroke-linecap: round;
    }

    .progress {
      fill: none;
      stroke: #7f8968;
      stroke-width: 6;
      stroke-linecap: round;
      transition: all 0.25s ease;
    }

    .label {
      margin-top: -6px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 14.5px;
      font-weight: 400;
      color: #2f2925;
      line-height: 1;
    }

    .heart {
      color: #bd7f86;
      font-size: 9.5px;
      margin-left: 3px;
      position: relative;
      top: -1px;
    }

    .buttons {
      margin-top: 9px;
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    button {
      border: 1px solid #eadfd8;
      background: #fffaf6;
      color: #6f5c52;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 7px;
      border-radius: 999px;
      padding: 3px 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #f6eee9;
    }

    button.active {
      background: #ede2dc;
      color: #2f2925;
      border-color: #d8c2b8;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="title">ENERGY LEVEL</div>

    <svg viewBox="0 0 120 70">
      <path 
        d="M22 60 A38 38 0 0 1 98 60" 
        class="track"
      />
      <path 
        id="progress"
        d="M22 60 A38 38 0 0 1 84 34" 
        class="progress"
      />
    </svg>

    <div class="label">
      <span id="label">High</span><span class="heart">♡</span>
    </div>

    <div class="buttons">
      <button onclick="setLevel('low')" id="btn-low">Low</button>
      <button onclick="setLevel('medium')" id="btn-medium">Med</button>
      <button onclick="setLevel('high')" id="btn-high">High</button>
      <button onclick="setLevel('veryhigh')" id="btn-veryhigh">Max</button>
    </div>
  </div>

  <script>
    const options = {
      low: {
        label: "Low",
        path: "M22 60 A38 38 0 0 1 48 26"
      },
      medium: {
        label: "Medium",
        path: "M22 60 A38 38 0 0 1 68 22"
      },
      high: {
        label: "High",
        path: "M22 60 A38 38 0 0 1 84 34"
      },
      veryhigh: {
        label: "Very High",
        path: "M22 60 A38 38 0 0 1 98 60"
      }
    };

    function setLevel(level) {
      const selected = options[level] || options.high;

      document.getElementById("label").textContent = selected.label;
      document.getElementById("progress").setAttribute("d", selected.path);

      Object.keys(options).forEach(key => {
        document.getElementById("btn-" + key).classList.remove("active");
      });

      document.getElementById("btn-" + level).classList.add("active");

      localStorage.setItem("energyLevel", level);
    }

    const savedLevel = localStorage.getItem("energyLevel") || "high";
    setLevel(savedLevel);
  </script>
</body>
</html>
