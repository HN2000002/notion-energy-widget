<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fffdfb;
      --border: #eadfd6;
      --text: #6b5648;
      --muted: #9a887b;
      --soft: #f7eee8;
      --tag-bg: #eef2e8;
      --tag-text: #7b8767;
      --shadow: rgba(95, 77, 64, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: transparent;
      font-family: "Inter", sans-serif;
      color: var(--text);
    }

    .widget {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      box-shadow: 0 2px 8px var(--shadow);
      white-space: nowrap;
    }

    .icon {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--soft);
      color: var(--text);
      font-size: 10px;
      line-height: 1;
      flex-shrink: 0;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 9px;
      font-weight: 600;
      line-height: 1;
    }

    .theme .tag {
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 500px) {
      .widget {
        gap: 8px;
      }

      .pill {
        padding: 7px 10px;
      }

      .theme .tag {
        max-width: 110px;
      }
    }
  </style>
</head>

<body>
  <div class="widget">

    <div class="pill">
      <div class="icon">◎</div>
      <div class="label">Focus</div>
      <div class="tag">High</div>
    </div>

    <div class="pill">
      <div class="icon">⚡</div>
      <div class="label">Energy</div>
      <div class="tag">Very High</div>
    </div>

    <div class="pill">
      <div class="icon">🌿</div>
      <div class="label">Cycle</div>
      <div class="tag">Follicular</div>
    </div>

    <div class="pill theme">
      <div class="icon">✳</div>
      <div class="label">Weekly Theme</div>
      <div class="tag">Grow with Grace</div>
    </div>

  </div>
</body>
</html>
