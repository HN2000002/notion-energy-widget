<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 132px;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 178px;
      height: 122px;
      background: #fffdf9;
      border: 1px solid #e8d9d0;
      border-radius: 15px;
      text-align: center;
      box-sizing: border-box;
      padding-top: 13px;
      box-shadow: 0 0 0 0.5px rgba(120, 90, 75, 0.04);
    }

    .title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 7.6px;
      letter-spacing: 1.9px;
      font-weight: 700;
      color: #2f2925;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    svg {
      width: 96px;
      height: 54px;
      overflow: visible;
      display: block;
      margin: 0 auto;
    }

    .track {
      fill: none;
      stroke: #e4dfd9;
      stroke-width: 6;
      stroke-linecap: round;
    }

    .progress {
      fill: none;
      stroke: #7f8968;
      stroke-width: 6;
      stroke-linecap: round;
    }

    .label {
      margin-top: -6px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 14.5px;
      font-weight: 400;
      color: #2f2925;
      line-height: 1;
    }

    .heart {
      color: #bd7f86;
      font-size: 9.5px;
      margin-left: 3px;
      position: relative;
      top: -1px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="title">ENERGY LEVEL</div>

    <svg viewBox="0 0 120 70">
      <path 
        d="M22 60 A38 38 0 0 1 98 60" 
        class="track"
      />
      <path 
        d="M22 60 A38 38 0 0 1 84 34" 
        class="progress"
      />
    </svg>

    <div class="label">High<span class="heart">♡</span></div>
  </div>
</body>
</html>
