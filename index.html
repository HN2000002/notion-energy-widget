<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 230px;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .focus-card {
      width: 760px;
      min-height: 165px;
      background: #fffdf9;
      border: 1px solid #e8d9d0;
      border-radius: 16px;
      box-sizing: border-box;
      padding: 16px 20px;
      color: #2f2925;
      position: relative;
      overflow: hidden;
    }

    .edit-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      border: 1px solid #e6d8d0;
      background: #fffaf6;
      color: #7d6258;
      border-radius: 999px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 8px;
      cursor: pointer;
      z-index: 5;
    }

    .edit-btn:hover {
      background: #f5ebe6;
    }

    .top-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon {
      font-size: 13px;
      color: #9b8174;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr 1fr;
      height: 105px;
    }

    .section {
      padding: 0 18px;
      border-left: 1px solid #eadfd8;
      box-sizing: border-box;
    }

    .section:first-child {
      border-left: none;
      padding-left: 0;
    }

    .section-title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 7.5px;
      letter-spacing: 1.4px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 13px;
      color: #3c332e;
    }

    .priority {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 12.5px;
      color: #3b322e;
      white-space: nowrap;
    }

    .number {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #efe2dc;
      color: #7d6258;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 9px;
      flex-shrink: 0;
    }

    .theme {
      text-align: center;
      padding-top: 14px;
    }

    .theme-main {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 19px;
      line-height: 1.15;
      color: #3a302b;
      min-height: 44px;
    }

    .theme-flourish {
      margin-top: 5px;
      font-size: 18px;
      color: #9c8b76;
    }

    .energy {
      text-align: center;
      padding-top: 1px;
    }

    svg {
      width: 112px;
      height: 60px;
      overflow: visible;
      display: block;
      margin: 0 auto;
    }

    .track {
      fill: none;
      stroke: #e4dfd9;
      stroke-width: 7;
      stroke-linecap: round;
    }

    .progress {
      fill: none;
      stroke: #7f8968;
      stroke-width: 7;
      stroke-linecap: round;
      transition: all 0.25s ease;
    }

    .energy-label {
      margin-top: -8px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 14px;
      color: #2f2925;
    }

    .heart {
      color: #bd7f86;
      font-size: 10px;
      margin-left: 3px;
      position: relative;
      top: -1px;
    }

    .controls {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1px solid #d8c9c0;
      background: #fffaf6;
      cursor: pointer;
      padding: 0;
    }

    .dot.active {
      background: #7f8968;
      border-color: #7f8968;
    }

    .cycle {
      text-align: center;
      padding-top: 5px;
    }

    .cycle-circle {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: #f3d9d5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 7px;
      color: #b8757d;
      font-size: 20px;
    }

    .cycle-label {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 13.5px;
      color: #2f2925;
      line-height: 1.1;
    }

    .cycle-day {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8px;
      letter-spacing: 0.6px;
      margin-top: 3px;
      color: #7d6258;
    }

    .edit-panel {
      display: none;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eadfd8;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .edit-panel.open {
      display: grid;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #eadfd8;
      border-radius: 10px;
      background: #fffaf6;
      padding: 6px 8px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 12px;
      color: #2f2925;
      outline: none;
    }

    input:focus {
      border-color: #d7bfb5;
      background: #fffdf9;
    }

    .save-btn {
      border: 1px solid #d7bfb5;
      background: #efe2dc;
      color: #5d453d;
      border-radius: 999px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 10px;
      cursor: pointer;
    }

    .save-btn:hover {
      background: #e8d7cf;
    }
  </style>
</head>

<body>
  <div class="focus-card">
    <button class="edit-btn" onclick="toggleEdit()">Edit</button>

    <div class="top-title">
      <span class="icon">◎</span>
      <span>TODAY’S FOCUS</span>
    </div>

    <div class="content-grid">
      <div class="section">
        <div class="section-title">Top 3 Priorities</div>

        <div class="priority">
          <span class="number">1</span>
          <span id="priority1">Job search & send applications</span>
        </div>

        <div class="priority">
          <span class="number">2</span>
          <span id="priority2">Gym session — lower body</span>
        </div>

        <div class="priority">
          <span class="number">3</span>
          <span id="priority3">Stream setup & dinner prep</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Today’s Theme</div>
        <div class="theme">
          <div id="theme" class="theme-main">Discipline<br>is Freedom</div>
          <div class="theme-flourish">⌁</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Energy Level</div>
        <div class="energy">
          <svg viewBox="0 0 120 70">
            <path d="M22 60 A38 38 0 0 1 98 60" class="track"/>
            <path id="progress" d="M22 60 A38 38 0 0 1 84 34" class="progress"/>
          </svg>

          <div class="energy-label">
            <span id="label">High</span><span class="heart">♡</span>
          </div>

          <div class="controls">
            <button class="dot" id="btn-low" onclick="setLevel('low')" title="Low"></button>
            <button class="dot" id="btn-medium" onclick="setLevel('medium')" title="Medium"></button>
            <button class="dot" id="btn-high" onclick="setLevel('high')" title="High"></button>
            <button class="dot" id="btn-veryhigh" onclick="setLevel('veryhigh')" title="Very High"></button>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Cycle Phase</div>
        <div class="cycle">
          <div class="cycle-circle">♧</div>
          <div id="cyclePhase" class="cycle-label">Menstrual</div>
          <div id="cycleDay" class="cycle-day">Day 2</div>
        </div>
      </div>
    </div>

    <div id="editPanel" class="edit-panel">
      <input id="inputPriority1" placeholder="Priority 1">
      <input id="inputPriority2" placeholder="Priority 2">
      <input id="inputPriority3" placeholder="Priority 3">
      <input id="inputTheme" placeholder="Today's theme">
      <input id="inputCyclePhase" placeholder="Cycle phase">
      <input id="inputCycleDay" placeholder="Cycle day">
      <button class="save-btn" onclick="saveEdits()">Save changes</button>
    </div>
  </div>

  <script>
    const options = {
      low: {
        label: "Low",
        path: "M22 60 A38 38 0 0 1 48 26"
      },
      medium: {
        label: "Medium",
        path: "M22 60 A38 38 0 0 1 68 22"
      },
      high: {
        label: "High",
        path: "M22 60 A38 38 0 0 1 84 34"
      },
      veryhigh: {
        label: "Very High",
        path: "M22 60 A38 38 0 0 1 98 60"
      }
    };

    function setLevel(level) {
      const selected = options[level] || options.high;

      document.getElementById("label").textContent = selected.label;
      document.getElementById("progress").setAttribute("d", selected.path);

      Object.keys(options).forEach(key => {
        document.getElementById("btn-" + key).classList.remove("active");
      });

      document.getElementById("btn-" + level).classList.add("active");

      localStorage.setItem("energyLevel", level);
    }

    function setText(id, value) {
      document.getElementById(id).innerHTML = value;
      localStorage.setItem(id, value);
    }

    function loadText(id) {
      const saved = localStorage.getItem(id);
      if (saved) {
        document.getElementById(id).innerHTML = saved;
      }
    }

    function toggleEdit() {
      const panel = document.getElementById("editPanel");
      panel.classList.toggle("open");

      document.getElementById("inputPriority1").value = document.getElementById("priority1").innerText;
      document.getElementById("inputPriority2").value = document.getElementById("priority2").innerText;
      document.getElementById("inputPriority3").value = document.getElementById("priority3").innerText;
      document.getElementById("inputTheme").value = document.getElementById("theme").innerText;
      document.getElementById("inputCyclePhase").value = document.getElementById("cyclePhase").innerText;
      document.getElementById("inputCycleDay").value = document.getElementById("cycleDay").innerText;
    }

    function saveEdits() {
      setText("priority1", document.getElementById("inputPriority1").value);
      setText("priority2", document.getElementById("inputPriority2").value);
      setText("priority3", document.getElementById("inputPriority3").value);
      setText("theme", document.getElementById("inputTheme").value.replace(/\n/g, "<br>"));
      setText("cyclePhase", document.getElementById("inputCyclePhase").value);
      setText("cycleDay", document.getElementById("inputCycleDay").value);

      document.getElementById("editPanel").classList.remove("open");
    }

    ["priority1", "priority2", "priority3", "theme", "cyclePhase", "cycleDay"].forEach(loadText);

    const savedLevel = localStorage.getItem("energyLevel") || "high";
    setLevel(savedLevel);
  </script>
</body>
</html>
