<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 160px;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 185px;
      height: 148px;
      background: #fffdf9;
      border: 1px solid #e8d9d0;
      border-radius: 15px;
      text-align: center;
      box-sizing: border-box;
      padding-top: 12px;
      box-shadow: 0 0 0 0.5px rgba(120, 90, 75, 0.04);
    }

    .title {
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 7.5px;
      letter-spacing: 1.8px;
      font-weight: 700;
      color: #2f2925;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    svg {
      width: 96px;
      height: 50px;
      overflow: visible;
      display: block;
      margin: 0 auto;
    }

    .track {
      fill: none;
      stroke: #e4dfd9;
      stroke-width: 6;
      stroke-linecap: round;
    }

    .progress {
      fill: none;
      stroke: #7f8968;
      stroke-width: 6;
      stroke-linecap: round;
      transition: all 0.25s ease;
    }

    .label {
      margin-top: -6px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 14.5px;
      font-weight: 400;
      color: #2f2925;
      line-height: 1;
    }

    .heart {
      color: #bd7f86;
      font-size: 9.5px;
      margin-left: 3px;
      position: relative;
      top: -1px;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 7px;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      border: 1px solid #d8c9c0;
      background: #fffaf6;
      cursor: pointer;
      padding: 0;
    }

    .dot.active {
      background: #7f8968;
      border-color: #7f8968;
    }

    .dot:hover {
      background: #d8c9c0;
    }

    .hint {
      margin-top: 5px;
      font-family: "Libre Baskerville", Georgia, serif;
      font-size: 6.5px;
      letter-spacing: 1px;
      color: #9a8177;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="title">ENERGY LEVEL</div>

    <svg viewBox="0 0 120 70">
      <path 
        d="M22 60 A38 38 0 0 1 98 60" 
        class="track"
      />
      <path 
        id="progress"
        d="M22 60 A38 38 0 0 1 84 34" 
        class="progress"
      />
    </svg>

    <div class="label">
      <span id="label">High</span><span class="heart">♡</span>
    </div>

    <div class="controls">
      <button class="dot" id="btn-low" onclick="setLevel('low')" title="Low"></button>
      <button class="dot" id="btn-medium" onclick="setLevel('medium')" title="Medium"></button>
      <button class="dot" id="btn-high" onclick="setLevel('high')" title="High"></button>
      <button class="dot" id="btn-veryhigh" onclick="setLevel('veryhigh')" title="Very High"></button>
    </div>

    <div class="hint">tap to change</div>
  </div>

  <script>
    const options = {
      low: {
        label: "Low",
        path: "M22 60 A38 38 0 0 1 48 26"
      },
      medium: {
        label: "Medium",
        path: "M22 60 A38 38 0 0 1 68 22"
      },
      high: {
        label: "High",
        path: "M22 60 A38 38 0 0 1 84 34"
      },
      veryhigh: {
        label: "Very High",
        path: "M22 60 A38 38 0 0 1 98 60"
      }
    };

    function setLevel(level) {
      const selected = options[level] || options.high;

      document.getElementById("label").textContent = selected.label;
      document.getElementById("progress").setAttribute("d", selected.path);

      Object.keys(options).forEach(key => {
        document.getElementById("btn-" + key).classList.remove("active");
      });

      document.getElementById("btn-" + level).classList.add("active");

      localStorage.setItem("energyLevel", level);
    }

    const savedLevel = localStorage.getItem("energyLevel") || "high";
    setLevel(savedLevel);
  </script>
</body>
</html>
